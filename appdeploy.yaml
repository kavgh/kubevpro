apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproapp
  labels:
    app: vproapp
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: vproapp
  selector:
    matchLabels:
      app: vproapp
  spec:
    containers:
    - name: vproapp
      image: vprocontainers/vprofileapp
      ports:
      - name: vproapp-port
        containerPort: 8080
    initContainers:
    - name: init-db
      image: busybox:latest
      command: ["sh", "-c", "until nslookup vprodb.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for vprodb; sleep 2; done"]
    - name: init-rmq
      image: busybox:latest
      command: ["sh", "-c", "until nslookup vpromq01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for vprormq; sleep 2; done"]
    - name: init-mc
      image: busybox:latest
      command: ["sh", "-c", "until nslookup vprocache01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for vpromc; sleep 2; done"]