apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vpro-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true" 
spec:
  ingressClassName: nginx
  rules:
  - host: vprofile.kavdom.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vproappsvc
            port:
              number: 8080
